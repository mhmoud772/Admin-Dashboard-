<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>لوحة التحكم الإدارية العامة</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <!-- Replace Space Grotesk/Inter with Cairo/Tajawal for Arabic OR keep original, let's mix for DevOps vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-container": "#4d8eff",
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#c2c6d6",
                        "outline-variant": "#424754",
                        "surface-container": "#171f33",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#304671",
                        "error-container": "#93000a",
                        "surface-dim": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "surface-container-lowest": "#060e20",
                        "primary": "#adc6ff",
                        "secondary": "#b1c6f9",
                        "background": "#0b1326",
                        "tertiary": "#ffb786",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#2d3449",
                        "surface-container-high": "#222a3d",
                        "surface": "#0b1326",
                    },
                    fontFamily: {
                        "headline": ["Cairo", "sans-serif"],
                        "body": ["Cairo", "sans-serif"],
                        "label": ["Cairo", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1326; color: #dae2fd; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #060e20; }
        ::-webkit-scrollbar-thumb { background: #222a3d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #31394d; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Sidebar -->
    <nav class="hidden md:flex flex-col h-full bg-[#0b1326] w-64 fixed right-0 top-0 border-l border-[#424754]/15">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary text-xl">satellite_alt</span>
                </div>
                <div>
                    <h1 class="text-xl font-black text-[#adc6ff] font-headline tracking-tight">المتحكم الرئيسي</h1>
                    <p class="text-xs text-on-surface-variant font-label">الحالة: مثالية</p>
                </div>
            </div>
            
            <ul class="space-y-2 font-body text-sm">
                <li>
                    <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-DEFAULT hover:bg-[#131b2e] transition-all duration-200">
                        <span class="material-symbols-outlined">dashboard</span>
                        نظرة عامة
                    </a>
                </li>
                <li>
                    <a href="/systems" class="flex items-center gap-3 px-4 py-3 rounded-DEFAULT hover:bg-[#131b2e] transition-all duration-200">
                        <span class="material-symbols-outlined">dns</span>
                        الأنظمة
                    </a>
                </li>
                <li>
                    <a href="/logs" class="flex items-center gap-3 px-4 py-3 rounded-DEFAULT hover:bg-[#131b2e] transition-all duration-200">
                        <span class="material-symbols-outlined">terminal</span>
                        السجلات الموحدة (Logs)
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="mt-auto p-6">
            <a href="/systems" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-gradient-to-bl from-primary to-primary-container text-on-primary rounded-lg font-medium text-sm hover:shadow-[0_0_15px_rgba(173,198,255,0.15)] transition-all">
                <span class="material-symbols-outlined text-sm">add</span>
                إضافة نظام
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col md:mr-64 h-full overflow-hidden bg-surface relative">
        <header class="flex justify-between items-center w-full px-6 py-3 h-16 bg-[#0b1326]/80 backdrop-blur-xl border-b border-[#131b2e] sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <h2 class="text-lg font-bold text-[#adc6ff] font-headline tracking-tight">{% block header_title %}مركز القيادة{% endblock %}</h2>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 z-10">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
